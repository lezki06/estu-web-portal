
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure access portal for ESTU students to log in to the student information system.">
    <meta name="keywords" content="ESTU Login, Student Portal, Secure Login, Authentication.">
    <meta name="author" content="Şevki Duhan Lezki">
    <meta name="robots" content="index, follow">
    <title>Student Login | Secure Access Portal - ESTÜ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fafaf8; }
       .sidebar { background-color: #f7f6f3; }
       nav img {
               mix-blend-mode: multiply;
        }
        footer { background-color: #f7f6f3;
        border-top: 3px solid #c0392b !important }
        main { background-color: #ffffff; }
        .active-page { font-size: 1.1rem !important; font-weight: bold !important; }
        .sidebar { min-height: 500px; border-right: 1px solid #dee2e6; }
        footer { border: 1px solid #dee2e6; padding: 5px; }

        header {
            position: relative;
            overflow: hidden;
            height: 130px;
            border: none;
        }
        header img.header-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.52);
        }
        header h1 {
             position: relative;
            z-index: 1;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            margin: 0;
            padding: 36px 0;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        .nav-item-dropdown {
           position: relative;
        }
        .submenu {
           display: none;
           position: absolute;
           left: 100%;
           top: 0;
           background: white;
           border: 1px solid #dee2e6;
           border-radius: 6px;
           min-width: 130px;
           box-shadow: 2px 4px 10px rgba(0,0,0,0.1);
           z-index: 999;
        }
        .nav-item-dropdown:hover .submenu {
          display: block;
        }
       .submenu a {
          display: block;
          padding: 8px 14px;
          font-size: 0.82rem;
          color: #333;
          text-decoration: none;
       }
       .submenu a:hover {
          background: #fff5f5;
          color: #c0392b;
       }
       .nav-link {
         color: #333;
         border-radius: 6px;
         transition: background 0.2s, color 0.2s;
         border-bottom: 1px solid #e8e8e8;
       }
       .nav-link:hover {
        background: #fff0f0;
        color: #c0392b !important;
       }
       .active-page {
        color: #c0392b !important;
      }

      /* LOGIN CARD */
        .login-card {
            max-width: 420px;
            margin: 30px auto;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 36px 32px;
        }
        .login-card h2 {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0d1b2e;
            border-left: 4px solid #c0392b;
            padding-left: 10px;
            margin-bottom: 24px;
        }
        .form-label { font-size: 0.85rem; font-weight: 600; color: #333; }
        .form-control { font-size: 0.87rem; }
        .form-control:focus { border-color: #c0392b; box-shadow: 0 0 0 0.2rem rgba(192,57,43,0.15); }
        .btn-login {
            background: #c0392b;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #a93226; }

    </style>
</head>

<body>
    <div class="container-fluid py-3">

        <header class="text-center mb-3">
            <img src="images/deneme.jpg" alt="ESTU photo" class="header-bg">
            <h1 class="display-5">ESKİŞEHİR TECHNICAL UNIVERSITY</h1>
        </header>

        <div class="row">
            <nav class="col-md-1 sidebar">
                <img src="images/estu_logo.jpg" alt="ESTU Logo" class="img-fluid p-1 mt-2">
                <ul class="nav flex-column mt-3">
                    <li><a class="nav-link" href="index.html">HOME</a></li>
                    <li><a class="nav-link" href="university.html">UNIVERSITY</a></li>
                    <li><a class="nav-link" href="academics.html">ACADEMICS</a></li>
                    <li class="nav-item-dropdown">
                        <a class="nav-link active-page" href="students.html">STUDENTS</a>
                        <div class="submenu">
                            <a href="login.html">Student Login</a>
                            <a href="documents.html">Documents</a>
                        </div>
                    </li>
                    <li><a class="nav-link" href="campuslife.html">CAMPUS LIFE</a></li>
                </ul>
            </nav>

            <main class="col-md-11 p-4">

                <div class="login-card">
                    <h2>🔐 Student Login</h2>

                    <form id="loginForm" action="index.html" method="get">
                        <div class="mb-3">
                            <label for="username" class="form-label">Student Number / Username</label>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                placeholder="e.g. 12345679101"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe" style="font-size:0.83rem;">Remember me</label>
                        </div>

                        <button type="submit" class="btn-login">Login</button>
                    </form>

                    <p style="font-size:0.78rem; color:#999; text-align:center; margin-top:16px;">
                        Forgot your password? Contact <a href="mailto:obs@eskisehir.edu.tr" style="color:#c0392b;">obs@eskisehir.edu.tr</a>
                    </p>
                </div>

            </main>
        </div>

        <footer class="mt-3 text-center">
            <p>&copy;Eskişehir Technical University - 2026 - Şevki Duhan Lezki</p>
        </footer>
    </div>
</body>
</html>
